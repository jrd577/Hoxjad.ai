<style>

function drawCaption(c,words,tpl,t,dur,cy){
  if(!words.length)return;
  const G=3,per=dur/words.length,tt=t%dur,idx=Math.min(words.length-1,Math.floor(tt/per)),gs=Math.floor(idx/G)*G;
  const grp=words.slice(gs,gs+G).map(w=>tpl.up?w.toUpperCase():w);
  let size=tpl.size||76;
  const meas=()=>{c.font=fontCss({...tpl,size});return grp.map(w=>c.measureText(w).width)};
  let ws=meas();const gap=size*.28;let total=ws.reduce((a,b)=>a+b,0)+gap*(grp.length-1);
  if(total>650){size*=650/total;ws=meas();total=ws.reduce((a,b)=>a+b,0)+gap*(grp.length-1)}
  c.textBaseline="middle";c.textAlign="center";c.lineJoin="round";
  let x=360-total/2;
  grp.forEach((w,i)=>{
    const active=tpl.anim&&(gs+i===idx),cx=x+ws[i]/2;
    const local=(tt-idx*per)/per,sc=active?1+.2*Math.max(0,1-local*5):1;
    c.save();c.translate(cx,cy);c.scale(sc,sc);
    if(active&&tpl.box){c.fillStyle=tpl.box;const bw=ws[i]+size*.3,bh=size*1.15;c.fillRect(-bw/2,-bh/2,bw,bh)}
    if(tpl.shadow){c.shadowColor="rgba(0,0,0,.75)";c.shadowBlur=14;c.shadowOffsetY=4}
    if(tpl.stroke&&!(active&&tpl.box)){c.strokeStyle=tpl.stroke;c.lineWidth=tpl.sw||8;c.strokeText(w,0,0)}
    c.fillStyle=active&&tpl.act?tpl.act:tpl.fill;c.fillText(w,0,0);c.restore();
    x+=ws[i]+gap});
}

function mkVideo(url,loop){const v=document.createElement("video");v.src=url;v.playsInline=true;v.loop=loop;v.muted=true;v.preload="auto";return v}
function makeScene(kind,S,exp){
  const top=(!S.sample&&S.url)?mkVideo(S.url,!exp):null;
  const bgv=(kind==="split"&&S.bg==="upload"&&S.bgUrl)?mkVideo(S.bgUrl,true):null;
  const dur=()=>S.sample?8:Math.max(1,Math.min(60,S.dur||8));
  return{top,dur:dur(),
   draw(c,t){
     c.fillStyle="#000";c.fillRect(0,0,720,1280);
     const tm=top?top.currentTime:t,words=(S.script||"").trim().split(/\s+/).filter(Boolean),tpl=TPL[S.tpl]||TPL[0],d=dur();
     if(kind==="split"){
       if(top)drawCover(c,top,top.videoWidth,top.videoHeight,0,0,720,640);else drawSample(c,0,0,720,640,t);
       if(bgv)drawCover(c,bgv,bgv.videoWidth,bgv.videoHeight,0,640,720,640);
       else clipRect(c,0,640,720,640,(cc,w,h)=>BG[S.bg in BG?S.bg:"runner"].draw(cc,w,h,t));
       c.fillStyle="rgba(255,255,255,.9)";c.fillRect(0,638,720,4);
       drawCaption(c,words,tpl,tm,d,640);
     }else if(kind==="editor"){
       if(top)drawCover(c,top,top.videoWidth,top.videoHeight,0,0,720,1280);else drawSample(c,0,0,720,1280,t);
       drawCaption(c,words,tpl,tm,d,980);
     }else{
       if(top){c.save();c.filter=`blur(${S.blur}px)`;drawCover(c,top,top.videoWidth,top.videoHeight,-60,-60,840,1400);c.restore();
         c.fillStyle="rgba(0,0,0,.28)";c.fillRect(0,0,720,1280);
         const vw=top.videoWidth||16,vh=top.videoHeight||9,r=Math.min(720/vw,1280/vh),dw=vw*r,dh=vh*r;c.drawImage(top,(720-dw)/2,(1280-dh)/2,dw,dh)}
       else{clipRect(c,0,0,720,1280,(cc,w,h)=>BG.waves.draw(cc,w,h,t));drawSample(c,0,430,720,420,t)}
       drawCaption(c,words,tpl,tm,d,1040);
     }
   },
   async start(){for(const v of [top,bgv]){if(!v)continue;await new Promise(r=>{if(v.readyState>=2)r();else{v.onloadeddata=r;v.onerror=r;setTimeout(r,4000)}});v.play().catch(()=>{})}},
   stop(){for(const v of [top,bgv]){if(v){v.pause();v.removeAttribute("src");v.load()}}}};
}
function makeTextsScene(S){
  const lines=()=>S.lines.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(me|them)\s*:\s*(.*)$/i);return m?{me:m[1].toLowerCase()==="me",t:m[2]}:{me:false,t:l}});
  const STEP=1.5;
  return{dur:Math.max(4,lines().length*STEP+1.5),top:null,
   draw(c,t){
     const L=lines(),loop=(t%Math.max(4,L.length*STEP+1.5));
     c.fillStyle="#000";c.fillRect(0,0,720,1280);
     clipRect(c,0,0,720,1280,(cc,w,h)=>BG[S.bg in BG?S.bg:"neon"].draw(cc,w,h,t));
     c.fillStyle="rgba(8,14,12,.72)";c.fillRect(0,0,720,1280);
     c.fillStyle="rgba(255,255,255,.1)";c.fillRect(0,150,720,110);
     c.fillStyle="#2FD6A1";c.beginPath();c.arc(90,205,34,0,7);c.fill();
     c.fillStyle="#04231A";c.font='700 34px "DM Sans",sans-serif';c.textAlign="center";c.textBaseline="middle";c.fillText((S.contact||"?")[0].toUpperCase(),90,206);
     c.fillStyle="#fff";c.textAlign="left";c.font='700 34px "DM Sans",sans-serif';c.fillText(S.contact||"Contact",146,205);
     let y=310;c.font='500 34px "DM Sans",sans-serif';
     L.forEach((m,i)=>{
       const at=i*STEP;if(loop<at)return;const k=Math.min(1,(loop-at)/.25),sc=.85+.15*Math.min(1,k*1.2);
       const maxW=470,words=m.t.split(" "),rows=[];let cur="";
       words.forEach(w=>{const test=cur?cur+" "+w:w;if(c.measureText(test).width>maxW&&cur){rows.push(cur);cur=w}else cur=test});rows.push(cur);
       const bw=Math.min(maxW,Math.max(...rows.map(r=>c.measureText(r).width)))+44,bh=rows.length*44+30,bx=m.me?700-bw:20;
       c.save();c.globalAlpha=k;c.translate(bx+(m.me?bw:0),y+bh);c.scale(sc,sc);c.translate(-(bx+(m.me?bw:0)),-(y+bh));
       c.fillStyle=m.me?"#0A7A5A":"#2b3531";c.beginPath();c.roundRect(bx,y,bw,bh,28);c.fill();
       c.fillStyle="#fff";c.textAlign="left";rows.forEach((r,j)=>c.fillText(r,bx+22,y+15+22+j*44));c.restore();
       y+=bh+18});
   },
   async start(){},stop(){}};
}
function startPreview(canvas,scene){
  const ctx=canvas.getContext("2d"),k=canvas.width/720;let live=true,raf;const t0=performance.now();
  scene.start();
  (function f(){if(!live)return;ctx.setTransform(k,0,0,k,0,0);try{scene.draw(ctx,(performance.now()-t0)/1000)}catch(e){}raf=requestAnimationFrame(f)})();
  cleanups.push(()=>{live=false;cancelAnimationFrame(raf);scene.stop()});
}

/* ---------- export: records the canvas to a video file in the browser ---------- */
async function recordScene(scene,onp){
  const cv=document.createElement("canvas");cv.width=720;cv.height=1280;const ctx=cv.getContext("2d");
  const stream=cv.captureStream(30);let ac=null;
  await loadFonts();
  if(scene.top){
    try{ac=new (window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaElementSource(scene.top),dest=ac.createMediaStreamDestination();src.connect(dest);scene.top.muted=false;dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}catch(e){ac=null}
    scene.top.loop=false;
  }
  await scene.start();
  const mime=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
  if(!mime)throw new Error("This browser cannot record video. Try Chrome, Edge or Firefox.");
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4e6}),chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const done=new Promise(r=>rec.onstop=r);
  const dur=scene.dur;rec.start(300);const t0=performance.now();
  await new Promise(res=>{(function loop(){const t=(performance.now()-t0)/1000;ctx.setTransform(1,0,0,1,0,0);scene.draw(ctx,t);onp(Math.min(1,t/dur));
    if(t>=dur||(scene.top&&scene.top.ended)){res();return}requestAnimationFrame(loop)})()});
  rec.stop();await done;scene.stop();if(ac)ac.close().catch(()=>{});
  return{blob:new Blob(chunks,{type:"video/webm"}),dur};
}

    assets.unshift({name:f.name,url:S.url,type:"Video",size:f.size});

    v.onloadedmetadata=()=>{S.dur=v.duration||8;if(S.dur>60)toast("Only the first 60 seconds will be exported.");show()};

  function uploadStep(){
    const has=S.url||S.sample;
    frame(`<div class="panel"><div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload a video">${ic("upload")}<b>Drop a video here or click to browse</b><small>MP4, MOV or WebM. Up to 60 seconds are exported.</small></div><input type="file" id="file" accept="video/*" hidden>

    ${S.sample?`<p class="hint" style="margin-top:14px">Using the built-in sample clip (8 seconds). Upload your own any time.</p>`:""}

    ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
    drop.addEventListener("drop",e=>setFile(e.dataTransfer.files[0]));
    $("#useSample").onclick=()=>{S.sample=true;S.url=null;S.dur=8;show()};
    if($("#blur"))$("#blur").oninput=e=>{S.blur=+e.target.value;$("#blv").textContent=S.blur+"px"};
    $("#next").onclick=()=>{S.step++;show()};

  function bgStep(){
    frame(`<div class="panel"><div class="bgs">${Object.entries(BG).map(([id,b])=>`<button class="bg" data-bg="${id}" aria-pressed="${S.bg===id}"><canvas width="240" height="213"></canvas><b>${b.name}</b></button>`).join("")}
    <button class="bg" data-bg="upload" aria-pressed="${S.bg==="upload"}"><div style="aspect-ratio:9/8;display:grid;place-items:center;background:var(--bg);color:var(--accent)">${ic("upload")}</div><b>${S.bgName?esc(S.bgName):"Upload your own"}</b></button></div>
    <input type="file" id="bgfile" accept="video/*" hidden><p class="hint" style="margin-top:12px">Backgrounds loop under your clip. Upload any gameplay or satisfying footage you have rights to use.</p>
    <div class="foot"><button class="btn" id="back">Back</button><button class="btn pri" id="next">Next</button></div></div>`);
    $$(".bg canvas").forEach((cv,i)=>{const id=Object.keys(BG)[i];cv.getContext("2d").scale(240/720,240/720);BG[id].draw(cv.getContext("2d"),720,640,2.2)});
    $$(".bg").forEach(b=>b.onclick=()=>{
      if(b.dataset.bg==="upload"){$("#bgfile").click();return}
      S.bg=b.dataset.bg;$$(".bg").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    $("#bgfile").onchange=e=>{const f=e.target.files[0];if(!f)return;if(S.bgUrl)URL.revokeObjectURL(S.bgUrl);S.bgUrl=URL.createObjectURL(f);S.bgName=f.name;S.bg="upload";assets.unshift({name:f.name,url:S.bgUrl,type:"Background",size:f.size});show()};
    $("#back").onclick=()=>{S.step--;show()};$("#next").onclick=()=>{S.step++;show()};
  }
  function subStep(){
    const list=TPL.map((t,i)=>[t,i]).filter(([t])=>!!t.anim===(S.tab==="anim"));
    frame(`<div class="panel"><div class="two"><div>
      <div class="tabs" role="group" aria-label="Caption type"><button data-tab="still" aria-pressed="${S.tab==="still"}">Still</button><button data-tab="anim" aria-pressed="${S.tab==="anim"}">Animated</button></div>
      <div class="tpls">${list.map(([t,i])=>`<button class="tpl" data-i="${i}" aria-pressed="${S.tpl===i}" aria-label="${t.n}"><span style="font-family:'${t.font}',Impact,sans-serif;font-weight:${t.weight||400};color:${t.fill};${t.stroke?`-webkit-text-stroke:${Math.max(2,(t.sw||8)/4)}px ${t.stroke};paint-order:stroke fill;`:""}${t.shadow?"text-shadow:0 2px 6px rgba(0,0,0,.8);":""}${t.up?"text-transform:uppercase;":""}">${t.act?`The <span style="color:${t.act};${t.box?`background:${t.box};padding:0 3px`:""}">quick</span> fox`:"The quick fox"}</span></button>`).join("")}</div>
      <label class="f" style="margin-top:18px">Captions script<textarea id="script" placeholder="Type or paste what is said in the video">${esc(S.script)}</textarea></label>
      <p class="hint">Words appear three at a time and are spread evenly over the clip, so write the script in the order it is spoken.</p></div>
      <div class="prev"><canvas id="pv" width="300" height="533"></canvas></div></div>
      <div class="foot"><button class="btn" id="back">Back</button><button class="btn pri" id="gen">${ic("spark")} Generate video</button></div></div>`);
    loadFonts();
    startPreview($("#pv"),makeScene(kind,S,false));
    $$(".tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;if(!!TPL[S.tpl].anim!==(S.tab==="anim"))S.tpl=TPL.findIndex(t=>!!t.anim===(S.tab==="anim"));show()});
    $$(".tpl").forEach(b=>b.onclick=()=>{S.tpl=+b.dataset.i;$$(".tpl").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    $("#script").oninput=e=>S.script=e.target.value;
    $("#back").onclick=()=>{S.step--;show()};
    $("#gen").onclick=async()=>{runCleanups();const r=await generate(makeScene(kind,S,true),S.name?S.name.replace(/\.[^.]+$/,""):M.t+" sample",M.t);if(r){S.result=r;show()}else show()};
  }
  function resultView(){
    const r=S.result;
    frame(`<div class="panel"><h2 style="font-size:22px;margin-bottom:12px">Your video is ready</h2><div class="two"><div><p class="hint">Saved to My Exports. ${fmt(r.dur)} · ${(r.size/1048576).toFixed(1)} MB · 720×1280 WebM.</p>
    <div class="row" style="margin:14px 0"><button class="btn pri" data-save="${r.name}">${ic("download")} Download</button><button class="btn" id="again">Make another</button><button class="btn" data-go="exports">Open My Exports</button></div>
    <div class="note"><b>Saving.</b> Download asks you to confirm the file name. If it does nothing in your view, press and hold the video and choose Save video.</div></div>
    <div class="prev"><video src="${r.url}" controls playsinline></video></div></div></div>`);
    $("#again").onclick=()=>{S.result=null;S.step=0;show()};
  }
  show();
}

/* voiceover (browser speech) */
VIEWS.voice=()=>{
  view().innerHTML=head("AI Voiceover","Preview a script with the voices installed on your device.")+`<div class="panel"><div class="two"><div>
   <label class="f">Script<textarea id="vtext" style="min-height:150px">Stop scrolling. In the next thirty seconds I will show you how to turn one clip into a finished short.</textarea></label>
   <label class="f">Voice<select id="vsel"></select></label>
   <label class="f">Speed <span class="mono" id="vrv">1.0x</span><input type="range" id="vrate" min="0.6" max="1.6" step="0.1" value="1"></label>
   <label class="f">Pitch <span class="mono" id="vpv">1.0</span><input type="range" id="vpitch" min="0.5" max="1.5" step="0.1" value="1"></label>
   <div class="row"><button class="btn pri" id="vplay">${ic("play")} Play</button><button class="btn" id="vstop">Stop</button></div></div>
   <div class="note"><b>Preview only.</b> Your browser speaks the text but cannot save the audio as a file. Exportable voices need a text-to-speech service on a server.</div></div></div>`;
  const sel=$("#vsel"),ok=!!window.speechSynthesis;
  const fill=()=>{const vs=speechSynthesis.getVoices();sel.innerHTML=vs.length?vs.map((v,i)=>`<option value="${i}">${esc(v.name)} (${v.lang})</option>`).join(""):'<option value="-1">Default voice</option>'};
  if(ok){fill();speechSynthesis.onvoiceschanged=fill}else{toast("This browser has no speech synthesis.")}
  $("#vrate").oninput=e=>$("#vrv").textContent=(+e.target.value).toFixed(1)+"x";
  $("#vpitch").oninput=e=>$("#vpv").textContent=(+e.target.value).toFixed(1);
  $("#vplay").onclick=()=>{if(!ok)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($("#vtext").value);const v=speechSynthesis.getVoices()[+sel.value];if(v)u.voice=v;u.rate=+$("#vrate").value;u.pitch=+$("#vpitch").value;speechSynthesis.speak(u)};
  $("#vstop").onclick=()=>ok&&speechSynthesis.cancel();
  cleanups.push(()=>ok&&speechSynthesis.cancel());
};
